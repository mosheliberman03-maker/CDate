name: Build Android APK

on:
  workflow_dispatch: {}
  push:
    branches:
      - main
      - claude/intro-animation-event-bot-concurrency-ihgy6j
    paths:
      - 'native/**'
      - '.github/workflows/build-apk.yml'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: native
    steps:
      - name: Check out the code
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Capacitor and plugins
        run: npm install

      - name: Generate the Android project
        run: npx cap add android

      - name: Generate the app icon (the web-app aleph logo)
        # our own small script (Pillow); @capacitor/assets kept failing to download its image library on GitHub's servers
        run: |
          python3 -m pip install --quiet pillow
          python3 make-icons.py

      - name: Add permissions for exact alarms
        run: node patch-android.js

      - name: Sync web assets and plugins
        run: npx cap sync android

      - name: Build the debug APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Rename the APK
        run: cp android/app/build/outputs/apk/debug/app-debug.apk ChabadCalendar.apk

      - name: Check the APK is signed with the permanent key (otherwise phones refuse the update)
        run: |
          WANT=$(keytool -list -v -keystore cdate-debug.keystore -storepass android -alias androiddebugkey | grep 'SHA256:' | awk '{print $2}')
          GOT=$($ANDROID_HOME/build-tools/$(ls $ANDROID_HOME/build-tools | sort -V | tail -1)/apksigner verify --print-certs ChabadCalendar.apk | grep 'SHA-256 digest' | head -1 | awk '{print $NF}' | tr a-f A-F | sed 's/../&:/g;s/:$//')
          echo "want $WANT"; echo "got  $GOT"
          [ "$WANT" = "$GOT" ]

      - name: Upload the APK as a build artifact
        uses: actions/upload-artifact@v4
        with:
          name: ChabadCalendar-apk
          path: native/ChabadCalendar.apk

      - name: Publish the APK to a stable download link
        uses: softprops/action-gh-release@v2
        with:
          tag_name: apk-latest
          name: Latest Chabad Calendar app
          body: |
            The newest build of the Chabad Calendar Android app.
            On your phone, download ChabadCalendar.apk below and tap it to install.
            (Android will ask once to allow installing from your browser.)
          files: native/ChabadCalendar.apk
          fail_on_unmatched_files: true
