name: Save Sefaria samples for testing (temporary)
on: workflow_dispatch
permissions:
  contents: write
jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          python3 - <<'PY'
          import json, urllib.request
          out = {}
          for u in [l.strip() for l in open('tools/sefaria-urls.txt') if l.strip()]:
              try:
                  with urllib.request.urlopen(urllib.request.Request(u, headers={'User-Agent': 'CDate test'}), timeout=60) as r:
                      out[u] = json.loads(r.read().decode())
              except Exception as e:
                  out[u] = {'__error': str(e)}
              print(u, 'error' if '__error' in out[u] else 'ok')
          json.dump(out, open('tools/sefaria-samples.json', 'w'), ensure_ascii=False)
          PY
          git config user.name "samples-bot"; git config user.email "actions@users.noreply.github.com"
          git add tools/sefaria-samples.json && git commit -m "Sefaria samples for testing" && git push
