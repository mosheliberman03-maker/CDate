name: Probe Sefaria (temporary)
on: workflow_dispatch
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - run: |
          set -x
          curl -sS -D - -H "Origin: https://mosheliberman03-maker.github.io" "https://www.sefaria.org/api/calendars?year=2026&month=11&day=2&diaspora=1&custom=ashkenazi" -o cal.json | grep -i "^HTTP\|access-control"
          python3 -c "
          import json;j=json.load(open('cal.json'))
          for it in j['calendar_items']:
              t=it['title']['en']
              if any(x in t for x in ['Parashat','Rambam','Tanya','Tanakh']):print(json.dumps({k:it[k] for k in it if k in ('title','displayValue','ref','url','extraDetails','order','category')},ensure_ascii=False)[:900])
          "
          curl -sS -D - -H "Origin: https://mosheliberman03-maker.github.io" "https://www.sefaria.org/api/v3/texts/Psalms.104-105?version=hebrew" -o ps.json | grep -i "^HTTP\|access-control"
          python3 -c "
          import json;j=json.load(open('ps.json'));print(list(j.keys()));v=j['versions'];print(len(v),[ (x.get('versionTitle'),x.get('language'),x.get('direction')) for x in v]);t=v[0]['text'];print(type(t),len(t),str(t)[:400])"
          curl -sS "https://www.sefaria.org/api/v3/texts/Rashi_on_Genesis.23.1-23.16?version=hebrew" -o r.json; python3 -c "
          import json;j=json.load(open('r.json'));print(j.get('ref'),str(j['versions'][0]['text'])[:500])"
          curl -sS "https://www.sefaria.org/api/v3/texts/Genesis.23.1-23.16?version=hebrew" -o g.json; python3 -c "
          import json;j=json.load(open('g.json'));print(j.get('ref'),j['versions'][0].get('versionTitle'),str(j['versions'][0]['text'])[:300])"
