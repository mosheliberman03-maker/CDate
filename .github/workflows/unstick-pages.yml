name: Unstick Pages publishing
# Run this when "pages build and deployment" fails with "due to in progress deployment".
on: workflow_dispatch
permissions:
  pages: write
  deployments: read
  contents: read
jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - env:
          GH_TOKEN: ${{ github.token }}
          R: ${{ github.repository }}
        run: |
          api(){ curl -sS -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" "$@"; }
          api "https://api.github.com/repos/$R/deployments?environment=github-pages&per_page=6" > d.json
          for sha in $(python3 -c "import json;print(' '.join(dict.fromkeys(x['sha'] for x in json.load(open('d.json')))))"); do
            echo "== cancel $sha"; api -X POST "https://api.github.com/repos/$R/pages/deployments/$sha/cancel" -o /dev/null -w "HTTP %{http_code}\n"
          done
          sleep 5
          echo "== request a fresh build"; api -X POST "https://api.github.com/repos/$R/pages/builds" -o /dev/null -w "HTTP %{http_code}\n"
