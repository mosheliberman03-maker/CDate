name: Unstick Pages publishing (one-off)
on: workflow_dispatch
permissions:
  pages: write
  deployments: write
  contents: read
jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - env:
          GH_TOKEN: ${{ github.token }}
          R: ${{ github.repository }}
        run: |
          api(){ curl -sS -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" "$@"; }
          echo "== pages deployment status"; api "https://api.github.com/repos/$R/pages/deployments/d617f623d142dcc436530044d86d9c2a756e0ece"
          echo "== recent github-pages deployments"
          api "https://api.github.com/repos/$R/deployments?environment=github-pages&per_page=8" > d.json
          python3 -c "import json;[print(x['id'],x['sha'][:7],x['created_at']) for x in json.load(open('d.json'))]"
          for id in $(python3 -c "import json;print(' '.join(str(x['id']) for x in json.load(open('d.json')) if x['sha'].startswith('d617f62')))"); do
            echo "== statuses of $id"; api "https://api.github.com/repos/$R/deployments/$id/statuses" | python3 -c "import json,sys;[print(s['state'],s['created_at']) for s in json.load(sys.stdin)]"
            echo "== marking $id as failed"; api -X POST "https://api.github.com/repos/$R/deployments/$id/statuses" -d '{"state":"failure","description":"stuck; cleared"}' -o /dev/null -w "HTTP %{http_code}\n"
          done
