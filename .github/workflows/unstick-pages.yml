name: Unstick Pages publishing (one-off)
on: workflow_dispatch
permissions:
  pages: write
  contents: read
jobs:
  cancel:
    runs-on: ubuntu-latest
    steps:
      - run: |
          curl -sS -X POST -H "Authorization: Bearer ${{ github.token }}" -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${{ github.repository }}/pages/deployments/d617f623d142dcc436530044d86d9c2a756e0ece/cancel" -w "\nHTTP %{http_code}\n"
