<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Shluchim Keep in Touch</title>

<style>
:root{color-scheme:dark;box-sizing:border-box;--bg:#04060f;--glass:rgba(20,26,48,.62);--line:rgba(255,255,255,.1);--tx:#eef1ff;--mut:#8f98bd;--day:#62b98a;--gray:#b8a76b;--night:#8c919b;--acc:#7f9cf0;
padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
html,body{height:100%;margin:0;background:var(--bg);color:var(--tx);font-family:-apple-system,BlinkMacSystemFont,"Inter","Segoe UI",system-ui,sans-serif;overflow:hidden;overscroll-behavior:none}
canvas{position:fixed;inset:0;width:100%;height:100%;touch-action:none;cursor:grab}
.glass{background:var(--glass);backdrop-filter:blur(22px) saturate(1.4);-webkit-backdrop-filter:blur(22px) saturate(1.4);border:1px solid var(--line);box-shadow:0 10px 40px rgba(0,0,0,.45)}
#top{position:fixed;top:calc(env(safe-area-inset-top,0px) + 12px);left:14px;right:14px;display:flex;align-items:center;justify-content:space-between;pointer-events:none}
#top>*{pointer-events:auto}
#menu{width:46px;height:46px;border-radius:15px;display:grid;place-content:center;gap:5px;cursor:pointer;color:var(--tx)}
#menu i{display:block;width:20px;height:2px;border-radius:2px;background:currentColor}
#chip{padding:9px 14px;border-radius:99px;font-size:13px;color:var(--mut);display:flex;gap:8px;align-items:center;font-variant-numeric:tabular-nums}
#chip b{width:7px;height:7px;border-radius:50%;background:var(--day);box-shadow:0 0 10px var(--day);animation:p 2s infinite}
@keyframes p{50%{opacity:.35}}
#bar{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(env(safe-area-inset-bottom,0px) + 18px);width:min(560px,calc(100% - 28px))}
#sb{display:flex;align-items:center;gap:10px;padding:0 18px;height:56px;border-radius:99px}
#sb svg{flex:none;opacity:.6}
#q{flex:1;background:none;border:0;outline:0;color:var(--tx);font-size:16px;min-width:0}
#q::placeholder{color:var(--mut)}
#res,#sheet{position:absolute;left:0;right:0;bottom:66px;border-radius:22px;padding:8px;max-height:46vh;overflow:auto;display:none}
.r{display:flex;align-items:center;gap:12px;padding:11px 12px;border-radius:14px;cursor:pointer}
.r:hover,.r:active{background:rgba(255,255,255,.07)}
.r small{color:var(--mut);display:block;margin-top:2px}
.tag{margin-left:auto;font-size:11px;color:var(--mut);border:1px solid var(--line);border-radius:99px;padding:3px 8px}
.dot{width:10px;height:10px;border-radius:50%;flex:none}
#sheet{padding:18px}
#sheet::before{content:"";display:block;width:40px;height:4px;border-radius:4px;background:rgba(255,255,255,.28);margin:-8px auto 12px}
#sheet h3{margin:0 0 2px;font-size:19px}#sheet p{margin:0 0 14px;color:var(--mut);font-size:14px}
#nm{width:100%;padding:14px 16px;border-radius:14px;border:1px solid var(--line);background:rgba(255,255,255,.06);color:var(--tx);font-size:16px;outline:0}
.btns{display:flex;gap:10px;margin-top:12px}
.btn{flex:1;padding:14px;border-radius:14px;border:0;font-size:15px;font-weight:600;cursor:pointer;color:var(--tx);background:rgba(255,255,255,.08)}
.btn.p{background:linear-gradient(135deg,#7c9cff,#9b7cff);color:#fff}
#scrim{position:fixed;inset:0;background:rgba(2,4,12,.5);opacity:0;pointer-events:none;transition:opacity .35s}
#dr{position:fixed;top:0;bottom:0;left:0;width:min(380px,92vw);transform:translateX(-105%);transition:transform .45s cubic-bezier(.2,.8,.2,1);padding:calc(env(safe-area-inset-top,0px) + 16px) 14px calc(env(safe-area-inset-bottom,0px) + 14px);display:flex;flex-direction:column;border-radius:0 28px 28px 0;background:rgba(12,16,34,.82)}
body.open #dr{transform:none}body.open #scrim{opacity:1;pointer-events:auto}
#dr h2{margin:6px 8px 14px;font-size:24px;letter-spacing:-.02em}
#tabs{display:flex;background:rgba(255,255,255,.06);border-radius:14px;padding:4px;margin:0 4px 12px}
#tabs button{flex:1;border:0;background:none;color:var(--mut);padding:10px;border-radius:11px;font-size:14px;font-weight:600;cursor:pointer;transition:.25s}
#tabs button.on{background:rgba(255,255,255,.12);color:var(--tx)}
#list{overflow:auto;flex:1;padding:0 4px}
.gh{display:flex;align-items:center;gap:8px;margin:16px 6px 8px;font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--mut)}
.it{display:flex;align-items:center;gap:12px;padding:12px;border-radius:18px;background:rgba(255,255,255,.04);margin-bottom:8px;cursor:pointer;transition:.2s}
.it:active{transform:scale(.985)}
.av{box-shadow:inset 0 1px 1px rgba(255,255,255,.4),0 0 12px -3px currentColor;width:42px;height:42px;border-radius:50%;display:grid;place-content:center;font-weight:700;flex:none;border:2px solid}
.it .m{flex:1;min-width:0}.it .m b{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.it .m small{color:var(--mut)}
.tm{text-align:right;font-variant-numeric:tabular-nums;font-size:18px;font-weight:600}.tm small{display:block;font-size:11px;font-weight:500}
.x{background:none;border:0;color:var(--mut);font-size:20px;padding:4px 6px;cursor:pointer}
.empty{color:var(--mut);text-align:center;padding:40px 20px;line-height:1.5}
#tip{position:fixed;padding:8px 12px;border-radius:12px;font-size:13px;pointer-events:none;opacity:0;transition:opacity .2s;transform:translate(-50%,-130%)}

#top{z-index:4}#bar{z-index:4}#scrim{z-index:8}#dr{z-index:9}
canvas{transition:opacity .5s}
body.cards canvas{pointer-events:none;opacity:.75}
#gb{width:46px;height:46px;border-radius:15px;display:none;place-items:center;cursor:pointer;color:var(--tx)}
#gb.on{background:rgba(124,156,255,.35);border-color:rgba(124,156,255,.6)}
#cards{position:fixed;z-index:2;left:50%;transform:translateX(-50%);width:min(560px,calc(100% - 28px));top:calc(env(safe-area-inset-top,0px) + 72px);bottom:calc(env(safe-area-inset-bottom,0px) + 90px);overflow:auto;display:none;padding:2px 0 8px;-webkit-overflow-scrolling:touch}
body.cards #cards{display:block}
.card{border-radius:22px;padding:14px 16px;margin-bottom:12px;border-left:4px solid var(--c);background:linear-gradient(135deg,color-mix(in srgb,var(--c) 16%,transparent),rgba(20,26,48,.5) 60%);box-shadow:inset 0 1px 0 rgba(255,255,255,.18),0 10px 40px rgba(0,0,0,.45)}
.card.pop{animation:pop .55s cubic-bezier(.2,.9,.3,1.2)}
@keyframes pop{0%{transform:translateY(28px) scale(.94);opacity:0}100%{transform:none;opacity:1}}
.ch{display:flex;align-items:center;gap:12px}
.ch .m{flex:1;min-width:0}.ch .m b{display:block;font-size:19px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.ch .m small{color:var(--mut)}
.card .tm{font-size:24px}
.pl{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px}
.pc{display:flex;align-items:center;gap:4px;padding:7px 6px 7px 14px;border-radius:99px;background:rgba(255,255,255,.09);font-size:15px;font-weight:600}
.pc button{background:none;border:0;color:var(--mut);font-size:18px;padding:0 8px;cursor:pointer}
.card{cursor:pointer}
.card:not(.open) .pl{display:none}
.chev{flex:none;color:var(--mut);transition:transform .25s}
.card.open .chev{transform:rotate(180deg)}
#su{position:fixed;inset:0;z-index:30;display:none;align-items:center;justify-content:center;padding:18px;overflow:auto}
body.su #su{display:flex}
body.su #top,body.su #bar,body.su #cards{display:none!important}
body.su canvas{pointer-events:none;opacity:.8}
.sucard{width:min(440px,100%);border-radius:28px;padding:24px;max-height:100%;overflow:auto}
.sucard h1{margin:0 0 4px;font-size:28px;letter-spacing:-.02em}
.sucard>p{margin:0 0 18px;color:var(--mut);font-size:14px;line-height:1.45}
.sucard input{width:100%;padding:14px 16px;border-radius:14px;border:1px solid var(--line);background:rgba(255,255,255,.06);color:var(--tx);font-size:16px;outline:0;margin-bottom:10px}
#suH,#suPH{color:var(--mut);font-size:13px;margin:4px 4px 6px}#suPH{margin:-2px 4px 12px}#suPH.ok{color:var(--day)}#suPH.bad{color:var(--night)}
#suM .r{border:1px solid transparent}
#suM .r.sel{background:rgba(124,156,255,.2);border-color:rgba(124,156,255,.6)}
.btn:disabled{opacity:.4;cursor:default}
.pc .ph{display:none;margin-left:6px;color:var(--acc);font-weight:500;font-size:14px;text-decoration:none}
.pc.sh .ph{display:inline}.pc .ph.none{color:var(--mut)}
.pc .nm{cursor:pointer}
.dh{display:flex;align-items:center;justify-content:space-between;gap:10px;margin:6px 8px 14px}.dh h2{margin:0}.dh .btn{flex:none;padding:9px 16px;font-size:14px}

#fb{margin-bottom:12px}
#sum{width:100%;display:flex;align-items:center;justify-content:space-between;padding:14px 18px;border-radius:20px;color:var(--tx);font-size:16px;font-weight:600;cursor:pointer;text-align:left;font-family:inherit}
#sum.on{border-color:var(--day)}#sum b{color:var(--day);font-size:24px;margin-right:8px}
#sum em{font-style:normal;color:var(--mut);font-size:13px;font-weight:500}
#fr{display:flex;gap:8px;margin-top:8px;overflow-x:auto;padding-bottom:2px}
.fc{flex:none;padding:9px 15px;border-radius:99px;border:1px solid var(--line);background:rgba(20,26,48,.6);color:var(--mut);font-size:13px;font-weight:600;cursor:pointer;font-family:inherit;transition:.2s}
.fc.on{color:var(--tx);background:rgba(124,156,255,.32);border-color:rgba(124,156,255,.65)}
body.fullc canvas{opacity:1}
body.fullc #cards,body.fullc #top,body.fullc #bar{display:none!important}
body.su #fcard{display:none!important}
#fcard{position:fixed;inset:0;z-index:6;display:none;flex-direction:column;padding:calc(env(safe-area-inset-top,0px) + 14px) 16px calc(env(safe-area-inset-bottom,0px) + 14px);background:linear-gradient(rgba(4,6,15,.1),rgba(4,6,15,.6));animation:fin .4s cubic-bezier(.2,.9,.3,1)}
@keyframes fin{from{opacity:0;transform:scale(.95)}to{opacity:1;transform:none}}
.fw{width:min(560px,100%);margin:0 auto;display:flex;flex-direction:column;flex:1;min-height:0}
#fback{align-self:flex-start;flex:none;padding:10px 18px}
.fbig{padding:16px 4px 14px;text-shadow:0 2px 14px rgba(0,0,0,.7)}
#fcity{font-size:34px;font-weight:800;letter-spacing:-.02em}
#ftime{font-size:56px;font-weight:300;font-variant-numeric:tabular-nums;line-height:1.1}
#fmeta{font-size:15px;font-weight:600;margin-top:4px}
#fpl{flex:1;overflow:auto;-webkit-overflow-scrolling:touch}
.fhint{text-align:center;color:var(--mut);font-size:12px;padding-top:8px}
.sw{position:relative;margin-bottom:10px;border-radius:20px;overflow:hidden}
.sw.sg{background:rgba(251,113,133,.85)}.sw.sg::after{content:"Remove";position:absolute;right:22px;top:50%;transform:translateY(-50%);font-weight:700;font-size:14px}
.pr{position:relative;z-index:1;padding:14px 14px 12px;border-radius:20px;background:rgba(16,22,42,.93);border:1px solid var(--line);touch-action:pan-y;user-select:none;-webkit-user-select:none;transition:transform .22s,opacity .22s}
.pt{display:flex;align-items:center;gap:2px}.pi{flex:1;min-width:0}
.pi b{display:block;font-size:18px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.pi small{color:var(--mut);font-size:14px}
.ib{background:none;border:0;font-size:22px;padding:6px 8px;cursor:pointer;color:var(--gray);transition:transform .15s}.ib:active{transform:scale(1.25)}.ib.off{color:var(--mut)}
.pa{display:flex;gap:8px;margin-top:10px}
.ab{flex:1;text-align:center;padding:12px;border-radius:13px;font-weight:700;font-size:15px;text-decoration:none;color:#04060f;background:var(--day)}.ab.wa{background:#25d366}
.it{touch-action:pan-y;user-select:none;-webkit-user-select:none}
#toast{position:fixed;z-index:20;left:50%;top:calc(env(safe-area-inset-top,0px) + 70px);transform:translate(-50%,-16px);opacity:0;pointer-events:none;transition:opacity .25s,transform .35s cubic-bezier(.2,.9,.3,1);display:flex;align-items:center;gap:14px;padding:12px 16px;border-radius:16px;width:max-content;max-width:min(520px,calc(100% - 28px));font-size:14px;line-height:1.4;background:rgba(20,26,48,.94);backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);border:1px solid var(--line);box-shadow:0 10px 40px rgba(0,0,0,.5)}
#toast.on{opacity:1;transform:translate(-50%,0);pointer-events:auto}
#toast button{flex:none;background:none;border:0;color:var(--acc);font-weight:700;font-size:14px;cursor:pointer;font-family:inherit}
.pw{display:flex;gap:8px;margin-bottom:6px}
.pw select{flex:none;max-width:132px;padding:14px 8px;border-radius:14px;border:1px solid var(--line);background:rgba(255,255,255,.06);color:var(--tx);font-size:16px;outline:0;font-family:inherit}
.pw option{background:#0c1022;color:#eef1ff}
.sucard .pw input,.pw input{width:auto;flex:1;min-width:0;margin-bottom:0;padding:14px 16px;border-radius:14px;border:1px solid var(--line);background:rgba(255,255,255,.06);color:var(--tx);font-size:16px;outline:0}
.phh{color:var(--mut);font-size:13px;margin:4px 4px 12px}.phh.ok{color:var(--day)}.phh.bad{color:var(--night)}
.cb{width:24px;height:24px;border-radius:8px;border:2px solid var(--mut);display:grid;place-content:center;font-size:15px;flex:none;transition:.15s}
.cb.on{background:var(--acc);border-color:var(--acc);color:#04060f}
.btn.on{background:rgba(124,156,255,.32)}
.btn{transition:transform .12s,background .2s}.btn:active{transform:scale(.97)}

.lg{display:inline-block;flex:none;background:var(--logo) center/contain no-repeat;width:23px;height:20px;vertical-align:middle}
.lg-l{display:block;width:60px;height:53px;margin:2px auto 14px}
.sucard h1{text-align:center;font-size:25px}
.sucard h1 .beta{display:block;width:max-content;margin:8px auto 0}
.sucard>p{text-align:center}
#chip{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);flex-direction:column;gap:3px;white-space:nowrap}
#chip .lg{width:26px;height:23px}
.cr{display:flex;align-items:center;gap:6px}
.brand{display:flex;align-items:center;gap:10px;margin:2px 8px 10px;padding-bottom:12px;border-bottom:1px solid var(--line)}
.brand b{font-size:14px;font-weight:650;letter-spacing:-.01em}
.brand .beta{margin-left:8px;font-size:10px;padding:2px 7px}
.brand .lg{width:28px;height:25px}
.pgw.pn{animation:pgn .26s ease}.pgw.pp{animation:pgp .26s ease}
@keyframes pgn{from{opacity:0;transform:translateX(34px)}}
@keyframes pgp{from{opacity:0;transform:translateX(-34px)}}
#cards{top:calc(env(safe-area-inset-top,0px) + 66px);bottom:calc(env(safe-area-inset-bottom,0px) + 84px)}
body.cards canvas{opacity:.5}
body.fullc canvas{opacity:1}
#fb{margin-bottom:14px}
#sum{background:none;border:0;box-shadow:none;backdrop-filter:none;-webkit-backdrop-filter:none;padding:2px 4px 14px;border-radius:0;font-size:26px;font-weight:700;letter-spacing:-.02em;justify-content:flex-start}
#sum b{font-size:26px;font-weight:700;margin-right:8px;color:var(--day)}
#sum em{display:none}
#sum.on span{text-decoration:underline;text-decoration-color:var(--day);text-underline-offset:7px}
#fr{display:flex;gap:2px;padding:3px;background:rgba(255,255,255,.06);border-radius:12px;overflow:visible}
.fc{flex:1;white-space:nowrap;text-align:center;padding:8px 4px;font-size:12.5px;font-weight:600;border:0;border-radius:9px;background:none;color:var(--mut)}
.fc.on{background:rgba(255,255,255,.14);color:var(--tx);border:0}
.card,.card.glass{background:var(--s1);border:0;border-left:0;border-radius:20px;padding:16px 18px;margin-bottom:10px;box-shadow:none;backdrop-filter:none;-webkit-backdrop-filter:none}
.card .ch .m b{font-size:17px;font-weight:600}
.card .ch .m b::before{display:none}
.card .ch .m small{font-size:13px;padding-left:0}
.card .tm{font-size:20px;font-weight:600;display:flex;flex-direction:column;align-items:flex-end;gap:5px}
.card .tm small{display:inline-block;font-size:11px;font-weight:600;padding:3px 9px;border-radius:99px;opacity:1;background:color-mix(in srgb,var(--c) 16%,transparent)}
.card .chev{display:block;width:14px;height:14px;opacity:.3}
#fcard{background:linear-gradient(rgba(10,15,31,.2),rgba(10,15,31,.85))}
#fback{background:rgba(255,255,255,.1);border-radius:99px;padding:9px 16px;font-weight:600}
#fcity{font-size:32px;font-weight:700;letter-spacing:-.02em}
#ftime{font-size:44px;font-weight:300}
#fmeta{font-size:14px;font-weight:500;color:var(--mut)}
.sw{margin-bottom:8px}
.pr{background:var(--s1);border:0;border-radius:18px;padding:14px 16px}
.pi b{font-size:17px;font-weight:600}.pi small{font-size:14px}
.ib{font-size:20px}.ib.off{opacity:.4}
.ab{background:rgba(127,156,240,.15);color:var(--acc);border-radius:12px;padding:11px;font-weight:600;font-size:14.5px}
.ab.wa{background:rgba(98,185,138,.15);color:var(--day)}
#bar{bottom:calc(env(safe-area-inset-bottom,0px) + 14px)}
#sb{height:50px;border-radius:16px;padding:0 16px}
#res,#sheet{border-radius:22px;background:rgba(20,28,56,.97);bottom:62px}
.r{padding:12px;border-radius:12px}
.btn{border-radius:12px;background:rgba(255,255,255,.08);font-weight:600;padding:13px}
.btn.p{background:var(--acc);color:#0a1020}
.btn.on{background:rgba(127,156,240,.25)}
#nm,.sucard input,.pw input,.pw select{background:rgba(255,255,255,.06);border:0;border-radius:12px}
#dr{background:rgba(12,18,38,.97);border:0;border-radius:0 24px 24px 0}
#dr h2{font-size:22px}
#tabs{background:rgba(255,255,255,.06);border-radius:12px}#tabs button.on{background:rgba(255,255,255,.14)}
.it{background:var(--s1);border-radius:16px}
.av{border:0;background:rgba(255,255,255,.08)!important;color:var(--tx)}
.sucard{background:rgba(14,20,42,.95);border-radius:24px}
#toast{background:rgba(24,32,62,.97);border-radius:14px}
.cb.on{background:var(--acc);border-color:var(--acc)}

/* swipe between globe and cards */
body.cards #cards{animation:slin .38s cubic-bezier(.2,.8,.2,1)}
@keyframes slin{from{transform:translateX(calc(-50% + 60px));opacity:0}to{transform:translateX(-50%);opacity:1}}
#dots{position:fixed;z-index:4;left:50%;transform:translateX(-50%);bottom:calc(env(safe-area-inset-bottom,0px) + 82px);display:none;gap:8px;padding:8px 10px;cursor:pointer}
#dots i{display:block;width:7px;height:7px;border-radius:50%;background:rgba(255,255,255,.3);transition:.25s}
#dots i.on{background:#fff;width:20px;border-radius:7px}
body.fullc #dots,body.su #dots{display:none!important}
#tour{position:fixed;inset:0;z-index:40;display:none}
body.tour #tour{display:block}
.tcard{position:absolute;left:14px;right:14px;margin:0 auto;max-width:420px;border-radius:22px;padding:18px 18px 14px;background:rgba(14,20,42,.94);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);border:1px solid var(--hair);box-shadow:0 12px 40px rgba(0,0,0,.5);transition:opacity .25s ease,transform .3s cubic-bezier(.2,.8,.2,1)}
.tcard.sw{opacity:0;transform:translateY(12px)}
.tcard.top{top:calc(env(safe-area-inset-top,0px) + 64px)}.tcard.bot{bottom:calc(env(safe-area-inset-bottom,0px) + 16px)}
.tcard h2{margin:0 0 4px;font-size:21px;letter-spacing:-.02em}
.beta{display:inline-block;vertical-align:middle;margin-left:6px;padding:2px 8px;border-radius:99px;font-size:11px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:#fff;background:linear-gradient(135deg,#7c9cff,#9b7cff)}
.tcard p{margin:0;color:#c3c9e4;font-size:15px}
.tl{display:flex;gap:14px;margin-top:12px;font-size:14px;font-weight:600}
.tl span{display:flex;align-items:center;gap:7px}.tl i{width:12px;height:12px;border-radius:4px;transform:rotate(45deg)}
.tdots{display:flex;justify-content:center;gap:7px;margin:14px 0 12px}
.tdots i{width:7px;height:7px;border-radius:50%;background:rgba(255,255,255,.25);transition:.25s}
.tdots i.on{width:20px;border-radius:7px;background:#fff}
.tb{display:flex;gap:10px}.tb .btn{flex:1;padding:11px}

/* brighter UI */
:root{--bg:#0f1730;--s1:#27345f;--glass:rgba(44,58,108,.74);--hair:rgba(255,255,255,.17);--line:rgba(255,255,255,.17);--tx:#fff;--mut:#c0c9ea;--acc:#a3baff;--day:#6fd6a0;--gray:#e0cc7c;--night:#a7adbd}
html,body{background:var(--bg)}
.glass{background:var(--glass);border-color:var(--hair)}
#dr{background:rgba(32,44,88,.97)}
#res,#sheet{background:rgba(40,54,104,.97)}
.sucard,.tcard{background:rgba(36,48,94,.96)}
#toast{background:rgba(46,60,112,.97)}
#fcard{background:linear-gradient(rgba(15,23,48,.12),rgba(15,23,48,.72))}
.btn{background:rgba(255,255,255,.15)}.btn.p{background:var(--acc);color:#0b1330}.btn.on{background:rgba(163,186,255,.35)}
#tabs,#fr{background:rgba(255,255,255,.11)}#tabs button.on,.fc.on{background:rgba(255,255,255,.24)}
.it,.pr,.card,.card.glass{background:var(--s1)}
#nm,.sucard input,.pw input,.pw select,#q{background:transparent}
#nm,.sucard input,.pw input,.pw select{background:rgba(255,255,255,.13)}
.r:hover,.r:active{background:rgba(255,255,255,.13)}
.ab{background:rgba(163,186,255,.24);color:#d3dfff}.ab.wa{background:rgba(111,214,160,.24);color:#9bedc0}
.av{background:rgba(255,255,255,.16)!important}
.tcard p{color:#e6ebfc}
#scrim{background:rgba(8,12,30,.4)}
.empty,.fhint,.phh{color:var(--mut)}

/* Home-screen widgets sheet (Android app only) */
.kw{display:flex;gap:12px;align-items:center;padding:12px;border-radius:16px;background:rgba(255,255,255,.05);border:1px solid var(--line);margin-top:10px}
.kw .pv{flex:none;width:92px;border-radius:14px;padding:8px;background:linear-gradient(180deg,#141a33,#07091a);border:1px solid rgba(255,255,255,.13)}
.kw .pv i{display:flex;align-items:center;gap:5px;height:13px;margin-top:4px;border-radius:5px;background:rgba(255,255,255,.07);padding:0 5px}
.kw .pv i:before{content:"";width:5px;height:5px;border-radius:50%;background:var(--c,#6fd6a0)}
.kw .pv i:after{content:"";margin-left:auto;width:8px;height:8px;border-radius:50%;background:var(--c,#6fd6a0)}
.kw .pv u{display:block;text-decoration:none;font-size:9px;font-weight:700;color:#eef1ff}
.kw .pv em{display:block;font-style:normal;font-size:22px;font-weight:800;color:#6fd6a0;line-height:1}
.kw .tx{flex:1;min-width:0}
.kw .tx b{display:block;font-size:15px}
.kw .tx small{display:block;color:var(--mut);font-size:12.5px;margin:2px 0 8px;line-height:1.4}
.kw .tx .btn{width:100%;padding:10px;flex:none}
.kw .tx .btn.done{background:rgba(111,214,160,.18);color:#6fd6a0}

/* hands-on tour: let taps reach the real app under the card, and a glowing ring on what to tap */
body.tpass #tour{pointer-events:none}
body.tpass #tour .tcard{pointer-events:auto}
#tour{z-index:40}
.tpulse{position:relative;z-index:41;outline:2.5px solid #9fd0ff;outline-offset:3px;animation:tpulse 1.3s ease-out infinite!important}
@keyframes tpulse{0%{box-shadow:0 0 0 3px rgba(140,196,255,.9),0 0 22px 4px rgba(140,196,255,.7)}70%{box-shadow:0 0 0 18px rgba(140,196,255,0),0 0 22px 4px rgba(140,196,255,.45)}100%{box-shadow:0 0 0 3px rgba(140,196,255,0),0 0 22px 4px rgba(140,196,255,.7)}}
body.tour.tpass #top,body.tour.tpass #bar{z-index:41}

/* ☰ menu: account card + grouped rows (owner: "organize this, very crowded") */
#dr .mscroll{flex:1;overflow:auto;padding:0 2px;margin-top:4px}

/* What's new: popup for real features, slim banner for small ones (same rule as the calendar) */

 return'<div class="sw"><div class="pr" data-id="'+v.id+'"><div class="pt"><div class="pi"><b>'+esc(v.name)+'</b><small>'+(ph?esc(fmtPhone(ph)):"No number yet")+'</small></div><button class="ib'+(favs.has(k)?"":" off")+'" data-star="1" aria-label="Favorite">'+(favs.has(k)?"★":"☆")+"</button>"+(st!="day"?'<button class="ib'+(rem[k]?"":" off")+'" data-bell="1" aria-label="Remind me">'+(rem[k]?"🔔":"🔕")+"</button>":"")+"</div>"+(ph?'<div class="pa"><a class="ab" href="tel:+'+dg+'">📞 Call</a><a class="ab wa" href="https://wa.me/'+dg+'" target="_blank" rel="noopener">💬 WhatsApp</a></div>':"")+"</div></div>"}
function renderFull(){const f=$("fcard");if(!focusK){f.style.display="none";return}const g=groups().find(x=>x.k==focusK);if(!g){closeFull();return}
 const s=status(g.tz),pl=$("fpl"),y=pl.scrollTop,n=g.ppl.length;f.style.display="flex";
 $("fcity").textContent=g.city;$("ftime").textContent=clock(g.tz);$("fmeta").innerHTML='<span style="color:'+COL[s]+'">● '+LBL[s]+"</span> · "+n+" "+(n==1?"person":"people");
 pl.innerHTML=g.ppl.slice().sort((a,b)=>(favs.has(fk(b))?1:0)-(favs.has(fk(a))?1:0)||(a.name||"").localeCompare(b.name||"")).map(row).join("");pl.scrollTop=y}
function openFull(k){const g=groups().find(x=>x.k==k);if(!g)return;focusK=k;document.body.classList.add("fullc");hap(10);auto=false;fly(g.lon,g.lat);zoomT=6;renderFull();$("fpl").scrollTop=0}
function closeFull(){focusK=null;document.body.classList.remove("fullc");$("fcard").style.display="none"}
$("cards").onclick=e=>{const f=e.target.closest("[data-f]");if(f){if(f.id=="sum")flt=(flt.size==1&&flt.has("day"))?new Set():new Set(["day"]);else if(flt.has(f.dataset.f))flt.delete(f.dataset.f);else flt.add(f.dataset.f);hap(8);renderCards();return}
 if(e.target.closest("[data-mine]")){mineOnly=!mineOnly;hap(8);renderCards();return}
 const c=e.target.closest(".card");if(c)openFull(c.dataset.k)};
$("fcard").onclick=e=>{if(e.target.closest("#fback")){closeFull();return}if(Date.now()-swT<350)return;const pr=e.target.closest(".pr");if(!pr)return;const v=saved.find(x=>x.id==pr.dataset.id);if(!v)return;
 if(e.target.closest("[data-star]")){const k=fk(v);if(favs.has(k))favs.delete(k);else favs.add(k);saveF();hap(10);renderCards();return}
 if(e.target.closest("[data-bell]"))toggleBell(v)};
function swipe(root,sel,fn){let s=null;root.addEventListener("pointerdown",e=>{const el=e.target.closest(sel);if(!el||e.target.closest("a,button"))return;s={el,x:e.clientX,y:e.clientY,dx:0,on:0,id:e.pointerId}});
 root.addEventListener("pointermove",e=>{if(!s||e.pointerId!=s.id)return;const dx=e.clientX-s.x,dy=e.clientY-s.y;if(!s.on){if(Math.abs(dy)>10&&Math.abs(dy)>Math.abs(dx)){s=null;return}if(Math.abs(dx)>10){s.on=1;s.el.style.transition="none";s.el.parentElement.classList.add("sg");try{s.el.setPointerCapture(e.pointerId)}catch(x){}}}
  if(s&&s.on){s.dx=Math.min(0,dx);s.el.style.transform="translateX("+s.dx+"px)"}});
 const end=()=>{if(!s)return;const t=s;s=null;if(!t.on)return;swT=Date.now();t.el.style.transition="transform .22s,opacity .22s";if(t.dx<-Math.min(110,innerWidth*.3)){t.el.style.transform="translateX(-110%)";t.el.style.opacity="0";setTimeout(()=>fn(t.el),200)}else{t.el.style.transform="";t.el.parentElement.classList.remove("sg")}};
 root.addEventListener("pointerup",end);root.addEventListener("pointercancel",end)}

 const ok=()=>{const c=$("ecd").value;$("es").disabled=!(w.val().ok&&(!c||c.length>=4))},w=mkPhone($("ew"),ok);$("ecd").oninput=()=>{$("ecd").value=$("ecd").value.replace(/\D/g,"");ok()};w.set(me.phone||phoneOf(me.match.name,me.match.city));

// export / import
function importList(txt,xm){let o;try{o=JSON.parse(txt)}catch(e){xm.textContent="That isn’t a valid list.";return}const a=Array.isArray(o)?o:o&&o.saved;if(!Array.isArray(a)){xm.textContent="That isn’t a valid list.";return}let n=0;
 a.forEach(x=>{if(!x||typeof x.city!="string"||!isFinite(x.lat)||!isFinite(x.lon)||typeof x.tz!="string")return;try{new Intl.DateTimeFormat("en",{timeZone:x.tz})}catch(e){return}const nm=typeof x.name=="string"?x.name.slice(0,80):"";if(saved.some(z=>z.name==nm&&z.city==x.city))return;saved.push({id:Date.now()+Math.random(),name:nm,city:x.city.slice(0,80),country:String(x.country||"").slice(0,60),lat:+x.lat,lon:+x.lon,tz:x.tz});n++});
 if(o&&Array.isArray(o.favs))o.favs.forEach(k=>{if(typeof k=="string")favs.add(k.slice(0,200))});saveF();persist();render();commit(n?saved[saved.length-1].city:undefined,!!n);xm.textContent="Imported "+n+(n==1?" entry.":" entries.")}
$("ex").onclick=()=>{open(false);sheet._gs=null;sheet.innerHTML='<h3>Export / import</h3><p>Copy or save this text to keep your list. To restore it on another phone, paste it here (or pick the file) and tap Import.</p><textarea id="xt" rows="5" style="width:100%;padding:12px;border-radius:14px;border:1px solid var(--line);background:rgba(255,255,255,.06);color:var(--tx);font-size:14px;outline:0"></textarea><input type="file" id="xf" accept=".json,application/json,text/plain" style="margin-top:8px;color:var(--mut);width:100%"><div class="btns"><button class="btn" id="xs">Save file</button><button class="btn" id="xc">Copy</button></div><div class="btns"><button class="btn" id="xx">Close</button><button class="btn p" id="xi">Import</button></div><p id="xm" style="margin:10px 0 0"></p>';
 const ta=$("xt"),xm=$("xm");ta.value=JSON.stringify({app:"shlichus-clock",v:1,saved:saved.map(v=>({name:v.name,city:v.city,country:v.country,lat:v.lat,lon:v.lon,tz:v.tz})),favs:[...favs]});sheet.style.display="block";
 $("xx").onclick=()=>sheet.style.display="none";
 $("xc").onclick=async()=>{try{await navigator.clipboard.writeText(ta.value);xm.textContent="Copied."}catch(e){ta.select();try{document.execCommand("copy");xm.textContent="Copied."}catch(x){xm.textContent="Select the text and copy it by hand."}}};
 $("xs").onclick=async()=>{try{if(!(window.claude&&claude.use)){const a=document.createElement("a");a.href=URL.createObjectURL(new Blob([ta.value],{type:"application/json"}));a.download="shlichus-clock-list.json";document.body.appendChild(a);a.click();a.remove();xm.textContent="Saved.";return}const d=await claude.use("downloads");if(!d)throw 0;await d.save({filename:"shlichus-clock-list.json",data:ta.value});xm.textContent="Saved."}catch(e){xm.textContent="Couldn’t save a file here. Use Copy instead."}};
 $("xf").onchange=async e=>{const f=e.target.files[0];if(f)ta.value=await f.text()};
 $("xi").onclick=()=>importList(ta.value,xm)};
function tick(){const d=new Date();$("utc").textContent="UTC "+String(d.getUTCHours()).padStart(2,"0")+":"+String(d.getUTCMinutes()).padStart(2,"0");checkRem();if(d.getSeconds()==0){if(document.body.classList.contains("open"))render();renderCards()}}
setInterval(tick,1000);tick();render();setView(saved.length?"cards":"world");if(!me){su=true;document.body.classList.add("su")}

const sync=()=>{dots.style.display=saved.length&&!document.body.classList.contains("fullc")?"flex":"none";d0.classList.toggle("on",view!="cards");d1.classList.toggle("on",view=="cards")};

 const t0=e.touches[0];x0=t0.clientX;y0=t0.clientY;t=Date.now();

// ---------- What's new (STANDING RULE, owner — same as the calendar): every update bumps KIT_VER and adds a KIT_LOG entry.
// Only a real feature that makes a practical difference gets big:1 → the full popup; everything else → the slim banner at the top.
// apk:N = this needs app version N (a new download); the app then also shows "Update the app".
const KIT_VER=5,KIT_APK=1;
const KIT_LOG=[
 {v:1,big:1,t:"Home-screen widgets",d:"See who’s awake without opening the app, with Call and WhatsApp buttons, filters and sorting.",go:"widgets"},
 {v:2,big:1,t:"Add widgets from inside the app",d:"Menu → Home-screen widgets → Add. No more digging through your phone’s widget list.",go:"widgets",apk:1},
 {v:2,t:"New globe app icon",apk:1},
 {v:3,big:1,t:"A hands-on tour",d:"Find a bochur, save him, and see your list, step by step. Replay it anytime from the menu.",go:"tour"},
 {v:4,t:"A tidier menu: your account on top, everything else grouped"},
 {v:5,t:"The app now updates itself when you come back to it"}
];
const kitIsApp=()=>!!(window.Capacitor&&Capacitor.isNativePlatform&&Capacitor.isNativePlatform());
const kitSeenKey=()=>"kit_seen_"+(me&&me.match?slug(pkey(me.match.name,me.match.city)):"x");
async function kitApkVer(){if(!kitIsApp())return 99;try{const P=Capacitor.Plugins.KitWidget;const r=await P.info();return r&&r.ver?r.ver:1}catch(e){return 0}}
const APK_PAGE="https://mosheliberman03-maker.github.io/CDate/friends/download/";
async function kitNews(){if(!me||!me.match||su||document.body.classList.contains("tour"))return;
 let seen=+lsGet(kitSeenKey())||0;
 if(!lsGet("sc_tour")){lsSet(kitSeenKey(),KIT_VER);return} // brand-new users get the tour, not a backlog
 if(!seen){seen=KIT_VER-1} // first time tracked: only the latest note
 const av=await kitApkVer(),items=KIT_LOG.filter(x=>x.v>seen&&(!x.apk||kitIsApp()||!x.go));
 const needApk=kitIsApp()&&av<KIT_APK;
 if(!items.length){if(needApk&&!sessionStorage.getItem("kit_apk_later"))kitBar([{t:"A new version of the app is ready"}],true);return}
 if(items.some(x=>x.big))kitPopup(items,needApk);else kitBar(items,needApk)}
function kitDone(){lsSet(kitSeenKey(),KIT_VER)}
function kitGo(g){if(g=="tour"){open(false);tour.show()}else if(g=="widgets"){const b=$("wgt");if(b&&b.style.display!="none")b.click();else toast("Widgets are in the Android app.")}}
function kitPopup(items,needApk){const el=document.createElement("div");el.id="kitNew";
 el.innerHTML='<div class="kn-card"><div class="kn-tag">What’s new</div><h2>'+(items.filter(x=>x.big).length>1?"New in Keep in Touch":esc(items.find(x=>x.big).t))+'</h2><div class="kn-list">'+
  items.map((x,i)=>'<div class="kn-it'+(x.big?" big":"")+'"><span class="kn-dot"></span><div><b>'+esc(x.t)+'</b>'+(x.d?'<small>'+esc(x.d)+'</small>':'')+(x.go&&(x.go!="widgets"||kitIsApp())?'<button class="kn-show" data-go="'+x.go+'">Show me</button>':'')+'</div></div>').join("")+'</div>'+
  (needApk?'<a class="btn p kn-upd" href="'+APK_PAGE+'">Update the app</a><div class="kn-note">Some of these need the newest app. Install it over this one: your list stays.</div>':'')+
  '<button class="btn kn-ok">Got it</button></div>';
 document.body.appendChild(el);requestAnimationFrame(()=>el.classList.add("on"));hap(12);
 const close=()=>{kitDone();el.classList.remove("on");setTimeout(()=>el.remove(),300)};
 el.onclick=e=>{const g=e.target.closest("[data-go]");if(g){close();setTimeout(()=>kitGo(g.dataset.go),320);return}if(e.target.closest(".kn-ok")||e.target==el)close();if(e.target.closest(".kn-upd"))kitDone()}}
function kitBar(items,needApk){const el=document.createElement("div");el.id="kitBar";
 const n=items.length,apkOnly=needApk&&items.length==1&&!items[0].v;
 el.innerHTML='<div class="kb-row"><span class="kb-dot"></span><b>'+(apkOnly?"App update":"What’s new")+'</b><span class="kb-n">'+(apkOnly?"Tap to update":n+" small update"+(n>1?"s":""))+'</span><span class="kb-x" aria-label="Dismiss">✕</span></div>'+
  (apkOnly?'':'<div class="kb-list">'+items.map(x=>'<div>• '+esc(x.t)+'</div>').join("")+(needApk?'<a class="btn p" href="'+APK_PAGE+'" style="display:block;text-align:center;text-decoration:none;margin-top:10px">Update the app</a>':'')+'<button class="btn kb-ok">Got it</button></div>');
 document.body.appendChild(el);requestAnimationFrame(()=>el.classList.add("on"));
 const close=dx=>{if(!apkOnly)kitDone();else sessionStorage.setItem("kit_apk_later","1");el.style.transform=dx?"translateX("+(dx>0?120:-120)+"%)":"translateY(-140%)";el.style.opacity="0";setTimeout(()=>el.remove(),300)};
 el.onclick=e=>{if(e.target.closest(".kb-x")){close();return}if(e.target.closest(".kb-ok")){close();return}if(apkOnly){location.href=APK_PAGE;return}if(e.target.closest("a"))return;el.classList.toggle("open");hap(8)};
 let x0=null,y0=0,dx=0,dy=0;el.addEventListener("touchstart",e=>{x0=e.touches[0].clientX;y0=e.touches[0].clientY;dx=dy=0;el.style.transition="none"},{passive:true});
 el.addEventListener("touchmove",e=>{if(x0==null)return;dx=e.touches[0].clientX-x0;dy=Math.min(0,e.touches[0].clientY-y0);el.style.transform=Math.abs(dx)>Math.abs(dy)?"translateX("+dx+"px)":"translateY("+dy+"px)"},{passive:true});
 el.addEventListener("touchend",()=>{el.style.transition="";if(Math.abs(dx)>80)close(dx);else if(dy<-40)close();else el.style.transform="";x0=null})}
setTimeout(kitNews,1800);

// ---------- updates apply themselves (owner — same as the calendar): on opening/returning, fetch the live page and compare KIT_VER.
// Newer → reload at once if nothing is open (or as soon as the app is left); otherwise show a "Tap to update" banner.
let kitUpdPending=false,kitNewV=0;
// reload past the phone's saved copy (new address each version), and never twice for the same version (no loops)
function kitReload(){try{if(+sessionStorage.getItem("kit_tried")>=kitNewV){return}sessionStorage.setItem("kit_tried",kitNewV)}catch(e){}location.replace(location.pathname+"?u="+kitNewV)}
const kitBusy=()=>document.body.classList.contains("tour")||document.body.classList.contains("open")||document.body.classList.contains("fullc")||sheet.style.display=="block"||res.style.display=="block"||document.activeElement==q||!!$("kitNew");
async function kitCheckUpd(){try{const r=await fetch(location.pathname+"?v="+Date.now(),{cache:"no-store"});if(!r.ok)return;const t=await r.text(),m=t.match(/const KIT_VER=(\d+)/);if(!m||+m[1]<=KIT_VER)return;
 kitNewV=+m[1];let tried=0;try{tried=+sessionStorage.getItem("kit_tried")||0}catch(e){}
 kitUpdPending=tried<kitNewV;if(kitUpdPending&&!document.hidden&&!kitBusy()){kitReload();return}
 if(!$("kitUpd")){const b=document.createElement("div");b.id="kitUpd";b.innerHTML='<span class="kb-dot"></span><b>New version ready</b><span class="kb-n">Tap to update</span>';b.onclick=()=>{try{sessionStorage.removeItem("kit_tried")}catch(e){}kitReload()};document.body.appendChild(b);requestAnimationFrame(()=>b.classList.add("on"))}}catch(e){}}
document.addEventListener("visibilitychange",()=>{if(document.hidden){if(kitUpdPending)kitReload()}else kitCheckUpd()});
setTimeout(kitCheckUpd,2500);setInterval(()=>{if(!document.hidden)kitCheckUpd()},10*60000);
